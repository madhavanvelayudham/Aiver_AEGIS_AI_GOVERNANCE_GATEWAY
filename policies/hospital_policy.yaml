id: hospital_policy
name: City Hospital Policy
version: 1
extends: healthcare_policy
description: Specific governance rules for City Hospital deployment

rules:
  - id: phi_write_hitl
    name: PHI Write - Doctors Exempt During Business Hours
    description: Overrides healthcare policy - doctors can write PHI without HITL but others still require approval
    priority: 160
    decision: REQUIRE_HITL
    condition:
      all:
        - field: context.session_data_classification
          operator: equals
          value: PHI
        - field: action.type
          operator: equals
          value: write
        - field: context.user_role
          operator: not_equals
          value: doctor
        - field: context.human_approval_present
          operator: equals
          value: false

  - id: external_read_block
    name: Block External Read Access
    description: External users cannot read any data in hospital context
    priority: 140
    decision: BLOCK
    condition:
      all:
        - field: context.user_role
          operator: equals
          value: external
        - field: action.type
          operator: equals
          value: read

  - id: phi_high_risk_write_block
    name: Trusted Doctor High Risk PHI Override
    description: Override healthcare block so that doctors are not blocked by CRITICAL risk (other rules apply)
    priority: 180
    decision: BLOCK
    condition:
      all:
        - field: context.session_data_classification
          operator: equals
          value: PHI
        - field: action.type
          operator: equals
          value: write
        - field: context.risk_level
          operator: in
          value:
            - HIGH
            - CRITICAL
        - field: context.user_role
          operator: not_equals
          value: doctor
